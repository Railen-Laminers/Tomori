<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>drizzle ☁ a cozy place</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&family=Fredoka+One&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/phaser@3.70.0/dist/phaser.min.js"></script>
<script src="/socket.io/socket.io.js"></script>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

:root {
  --bg:       #1a1a2e;
  --surface:  #16213e;
  --panel:    #0f3460cc;
  --border:   rgba(255,255,255,0.08);
  --text:     #e8d5c4;
  --muted:    #8b7d6b;
  --cream:    #fdf6ec;
  --warm1:    #f4a261;
  --warm2:    #e76f51;
  --cozy1:    #a8dadc;
  --cozy2:    #457b9d;
  --accent:   #f4a261;
  --green:    #95d5b2;
  --radius:   16px;
  --radius-sm: 10px;
}

body {
  background: var(--bg);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  height: 100vh;
  overflow: hidden;
}

/* ═══════════════════════════════════════
   LOBBY
═══════════════════════════════════════ */
#lobby {
  position: fixed;
  inset: 0;
  background: linear-gradient(135deg, #1a1a2e 0%, #16213e 40%, #0f3460 100%);
  display: flex;
  align-items: center;
  justify-content: center;
  z-index: 200;
  overflow: hidden;
}

.lobby-stars {
  position: absolute;
  inset: 0;
  pointer-events: none;
}

.star {
  position: absolute;
  border-radius: 50%;
  background: #fff;
  opacity: 0;
  animation: twinkle var(--dur, 3s) ease-in-out infinite var(--delay, 0s);
}

@keyframes twinkle {
  0%, 100% { opacity: 0; transform: scale(0.5); }
  50% { opacity: var(--op, 0.6); transform: scale(1); }
}

.lobby-card {
  position: relative;
  background: rgba(15, 21, 62, 0.85);
  border: 1px solid rgba(255,255,255,0.12);
  border-radius: 28px;
  padding: 44px 48px 48px;
  width: 420px;
  max-width: 94vw;
  backdrop-filter: blur(24px);
  box-shadow: 0 40px 80px rgba(0,0,0,0.5), inset 0 1px 0 rgba(255,255,255,0.1);
}

.logo {
  font-family: 'Fredoka One', cursive;
  font-size: 3rem;
  color: var(--cream);
  letter-spacing: 1px;
  display: flex;
  align-items: center;
  gap: 10px;
  margin-bottom: 6px;
}

.logo-rain {
  font-size: 2rem;
  animation: sway 2s ease-in-out infinite;
}

@keyframes sway {
  0%, 100% { transform: rotate(-5deg); }
  50% { transform: rotate(5deg); }
}

.tagline {
  font-size: 0.78rem;
  color: var(--muted);
  letter-spacing: 1.5px;
  margin-bottom: 36px;
  font-weight: 600;
}

.step-dots {
  display: flex;
  gap: 6px;
  margin-bottom: 28px;
}

.sdot {
  width: 8px; height: 8px;
  border-radius: 50%;
  background: rgba(255,255,255,0.15);
  transition: all 0.3s;
}

.sdot.active {
  background: var(--warm1);
  box-shadow: 0 0 12px var(--warm1);
  width: 24px;
  border-radius: 4px;
}

.field-label {
  font-size: 0.7rem;
  font-weight: 700;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 8px;
}

.lobby-input {
  width: 100%;
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-sm);
  color: var(--cream);
  font-family: 'Nunito', sans-serif;
  font-size: 0.95rem;
  font-weight: 600;
  padding: 12px 16px;
  outline: none;
  transition: all 0.2s;
  margin-bottom: 14px;
}

.lobby-input:focus {
  border-color: var(--warm1);
  background: rgba(244,162,97,0.06);
  box-shadow: 0 0 0 3px rgba(244,162,97,0.15);
}

.lobby-input::placeholder { color: rgba(255,255,255,0.2); }

.btn-main {
  width: 100%;
  background: var(--warm1);
  border: none;
  border-radius: var(--radius-sm);
  color: #1a1a2e;
  font-family: 'Nunito', sans-serif;
  font-size: 0.92rem;
  font-weight: 800;
  letter-spacing: 0.5px;
  padding: 14px;
  cursor: pointer;
  transition: all 0.2s;
  position: relative;
  overflow: hidden;
}

.btn-main::after {
  content: '';
  position: absolute;
  inset: 0;
  background: rgba(255,255,255,0);
  transition: background 0.2s;
}

.btn-main:hover { background: #f6b37f; transform: translateY(-1px); box-shadow: 0 8px 24px rgba(244,162,97,0.4); }
.btn-main:active { transform: translateY(0); }

.divider {
  display: flex;
  align-items: center;
  gap: 12px;
  margin: 22px 0;
  font-size: 0.7rem;
  color: var(--muted);
  letter-spacing: 1px;
  font-weight: 700;
  text-transform: uppercase;
}

.divider::before, .divider::after {
  content: ''; flex: 1;
  height: 1px;
  background: rgba(255,255,255,0.06);
}

.join-row { display: flex; gap: 8px; }
.join-row .lobby-input { flex: 1; margin-bottom: 0; letter-spacing: 3px; text-transform: uppercase; }
.btn-join {
  background: rgba(255,255,255,0.06);
  border: 1.5px solid rgba(255,255,255,0.1);
  border-radius: var(--radius-sm);
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-size: 0.85rem;
  font-weight: 800;
  padding: 12px 18px;
  cursor: pointer;
  white-space: nowrap;
  transition: all 0.2s;
}

.btn-join:hover { border-color: var(--cozy1); color: var(--cozy1); }

.error-msg {
  color: #ff8fab;
  font-size: 0.75rem;
  font-weight: 700;
  min-height: 20px;
  margin-top: 10px;
}

/* ═══════════════════════════════════════
   GAME
═══════════════════════════════════════ */
#game-container {
  position: relative;
  width: 100vw;
  height: 100vh;
  display: none;
}

/* ═══════════════════════════════════════
   HUD
═══════════════════════════════════════ */
#hud {
  position: fixed;
  inset: 0;
  pointer-events: none;
  z-index: 50;
}

/* Top bar */
#top-bar {
  position: absolute;
  top: 14px;
  left: 14px;
  right: 14px;
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: all;
}

.hud-pill {
  background: rgba(15, 20, 50, 0.82);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50px;
  padding: 8px 16px;
  backdrop-filter: blur(16px);
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 0.78rem;
  font-weight: 700;
}

.room-code {
  font-family: 'Fredoka One', cursive;
  font-size: 1.05rem;
  color: var(--warm1);
  letter-spacing: 2px;
}

.presence-pip {
  width: 7px; height: 7px;
  border-radius: 50%;
  background: var(--green);
  box-shadow: 0 0 8px var(--green);
  animation: pip-pulse 2s ease-in-out infinite;
}

@keyframes pip-pulse {
  0%, 100% { opacity: 1; }
  50% { opacity: 0.4; }
}

#player-count-text { color: var(--muted); }

.hud-spacer { flex: 1; }

#leave-btn {
  background: rgba(231,111,81,0.12);
  border: 1px solid rgba(231,111,81,0.25);
  border-radius: 50px;
  color: #ff8fab;
  font-family: 'Nunito', sans-serif;
  font-size: 0.72rem;
  font-weight: 800;
  padding: 8px 16px;
  cursor: pointer;
  letter-spacing: 0.5px;
  transition: all 0.2s;
}

#leave-btn:hover { background: rgba(231,111,81,0.22); border-color: rgba(231,111,81,0.5); }

/* ═══════════════════════════════════════
   CHAT PANEL
═══════════════════════════════════════ */
#chat-panel {
  position: absolute;
  bottom: 90px;
  left: 14px;
  width: 300px;
  pointer-events: all;
}

#chat-messages {
  max-height: 180px;
  overflow-y: auto;
  display: flex;
  flex-direction: column;
  gap: 4px;
  margin-bottom: 8px;
  scrollbar-width: none;
}

#chat-messages::-webkit-scrollbar { display: none; }

.chat-msg {
  background: rgba(10, 14, 40, 0.78);
  border: 1px solid rgba(255,255,255,0.07);
  border-radius: 10px;
  padding: 7px 11px;
  font-size: 0.75rem;
  line-height: 1.45;
  backdrop-filter: blur(10px);
  animation: msg-in 0.25s ease;
}

@keyframes msg-in {
  from { opacity: 0; transform: translateY(6px) scale(0.98); }
  to   { opacity: 1; transform: none; }
}

.chat-msg .sender { font-weight: 800; margin-right: 5px; }

.chat-input-row { display: flex; gap: 6px; }

.chat-input-row input {
  flex: 1;
  background: rgba(10, 14, 40, 0.82);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50px;
  color: var(--cream);
  font-family: 'Nunito', sans-serif;
  font-size: 0.78rem;
  font-weight: 600;
  padding: 9px 16px;
  outline: none;
  backdrop-filter: blur(14px);
  transition: border-color 0.2s;
}

.chat-input-row input:focus { border-color: var(--warm1); }
.chat-input-row input::placeholder { color: rgba(255,255,255,0.2); }

.send-btn {
  background: var(--warm1);
  border: none;
  border-radius: 50%;
  width: 36px; height: 36px;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 1rem;
  transition: all 0.2s;
  flex-shrink: 0;
  color: #1a1a2e;
  font-weight: 900;
}

.send-btn:hover { background: #f6b37f; transform: scale(1.08); }

/* ═══════════════════════════════════════
   EMOTE BAR
═══════════════════════════════════════ */
#emote-bar {
  position: absolute;
  bottom: 18px;
  left: 50%;
  transform: translateX(-50%);
  display: flex;
  gap: 8px;
  pointer-events: all;
  background: rgba(10, 14, 40, 0.78);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 50px;
  padding: 8px 14px;
  backdrop-filter: blur(16px);
}

.emote-btn {
  width: 40px; height: 40px;
  border-radius: 50%;
  border: none;
  background: transparent;
  display: flex; align-items: center; justify-content: center;
  cursor: pointer;
  font-size: 1.2rem;
  transition: all 0.2s;
  position: relative;
}

.emote-btn:hover {
  background: rgba(255,255,255,0.1);
  transform: translateY(-4px) scale(1.15);
}

/* ═══════════════════════════════════════
   COSMETICS
═══════════════════════════════════════ */
#cosmetics-panel {
  position: absolute;
  top: 14px;
  right: 14px;
  pointer-events: all;
}

#cosmetics-toggle {
  background: rgba(10, 14, 40, 0.82);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 50px;
  color: var(--text);
  font-family: 'Nunito', sans-serif;
  font-size: 0.75rem;
  font-weight: 800;
  padding: 8px 16px;
  cursor: pointer;
  backdrop-filter: blur(14px);
  transition: all 0.2s;
  display: flex;
  align-items: center;
  gap: 6px;
}

#cosmetics-toggle:hover { border-color: var(--warm1); color: var(--warm1); }

#cosmetics-menu {
  display: none;
  position: absolute;
  top: calc(100% + 10px);
  right: 0;
  background: rgba(10, 14, 50, 0.94);
  border: 1px solid rgba(255,255,255,0.1);
  border-radius: 20px;
  padding: 18px;
  width: 240px;
  backdrop-filter: blur(24px);
  box-shadow: 0 20px 60px rgba(0,0,0,0.5);
  animation: pop-in 0.2s ease;
}

@keyframes pop-in {
  from { opacity: 0; transform: scale(0.94) translateY(-4px); }
  to { opacity: 1; transform: none; }
}

#cosmetics-menu.open { display: block; }

.cosm-label {
  font-size: 0.65rem;
  font-weight: 800;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--muted);
  margin-bottom: 10px;
  margin-top: 14px;
}

.cosm-label:first-child { margin-top: 0; }

.cosm-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 7px;
}

.cosm-item {
  background: rgba(255,255,255,0.05);
  border: 1.5px solid rgba(255,255,255,0.07);
  border-radius: 12px;
  height: 42px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  font-size: 1.05rem;
  transition: all 0.18s;
}

.cosm-item:hover {
  border-color: var(--warm1);
  background: rgba(244,162,97,0.12);
  transform: scale(1.08);
}

.cosm-item.selected {
  border-color: var(--warm1);
  background: rgba(244,162,97,0.18);
  box-shadow: 0 0 12px rgba(244,162,97,0.3);
}

/* ═══════════════════════════════════════
   MUSIC BAR
═══════════════════════════════════════ */
#music-bar {
  position: absolute;
  bottom: 18px;
  right: 14px;
  background: rgba(10, 14, 40, 0.82);
  border: 1px solid rgba(255,255,255,0.09);
  border-radius: 50px;
  padding: 9px 16px;
  display: flex;
  align-items: center;
  gap: 10px;
  pointer-events: all;
  backdrop-filter: blur(16px);
  font-size: 0.72rem;
  color: var(--muted);
  font-weight: 600;
}

.music-vinyl {
  font-size: 1.1rem;
  animation: spin 4s linear infinite;
}

@keyframes spin { to { transform: rotate(360deg); } }

.music-title {
  color: var(--text);
  font-size: 0.72rem;
  font-weight: 700;
  max-width: 130px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.music-eq { display: flex; gap: 2px; align-items: flex-end; height: 14px; }
.music-eq span {
  width: 3px;
  background: var(--warm1);
  border-radius: 2px;
  animation: eq 0.7s ease-in-out infinite alternate;
}
.music-eq span:nth-child(2) { animation-delay: 0.18s; }
.music-eq span:nth-child(3) { animation-delay: 0.34s; }
.music-eq span:nth-child(4) { animation-delay: 0.1s; }
@keyframes eq { from { height: 2px; } to { height: 14px; } }

/* ═══════════════════════════════════════
   HINT
═══════════════════════════════════════ */
#hint-bar {
  position: absolute;
  bottom: 18px;
  left: 320px;
  right: calc(14px + 200px + 14px);
  display: flex;
  justify-content: center;
  pointer-events: none;
}

#hint-text {
  font-size: 0.67rem;
  font-weight: 700;
  letter-spacing: 1.5px;
  text-transform: uppercase;
  color: rgba(255,255,255,0.18);
}
</style>
</head>
<body>

<!-- ═══ LOBBY ═══ -->
<div id="lobby">
  <div class="lobby-stars" id="lobby-stars"></div>

  <div class="lobby-card">
    <div class="logo">drizzle <span class="logo-rain">🌧</span></div>
    <div class="tagline">☁ a cozy place to hang out</div>

    <!-- Step 1: Username -->
    <div id="step-username">
      <div class="step-dots">
        <div class="sdot active"></div>
        <div class="sdot"></div>
      </div>
      <div class="field-label">your name</div>
      <input id="username-input" class="lobby-input" type="text" placeholder="e.g. moonpuddle" maxlength="20" autocomplete="off">
      <button class="btn-main" onclick="setUsername()">step inside ☁</button>
      <div class="error-msg" id="username-error"></div>
    </div>

    <!-- Step 2: Room -->
    <div id="step-room" style="display:none">
      <div class="step-dots">
        <div class="sdot"></div>
        <div class="sdot active"></div>
      </div>
      <div class="field-label">make a room</div>
      <button class="btn-main" onclick="createRoom()">☁ Create a cozy room</button>
      <div class="divider">or join one</div>
      <div class="field-label">room code</div>
      <div class="join-row">
        <input id="room-code-input" class="lobby-input" type="text" placeholder="XXXXX" maxlength="5" autocomplete="off">
        <button class="btn-join" onclick="joinRoom()">Join →</button>
      </div>
      <div class="error-msg" id="room-error"></div>
    </div>
  </div>
</div>

<!-- ═══ GAME ═══ -->
<div id="game-container">
  <div id="hud">

    <!-- Top bar -->
    <div id="top-bar">
      <div class="hud-pill">
        <span style="font-size:0.65rem;color:var(--muted);font-weight:700;letter-spacing:1px;">ROOM</span>
        <span class="room-code" id="room-code-display">-----</span>
      </div>
      <div class="hud-pill">
        <div class="presence-pip"></div>
        <span id="player-count-text">1 cozy</span>
      </div>
      <div class="hud-spacer"></div>
      <button id="leave-btn" onclick="leaveRoom()">✕ leave</button>
    </div>

    <!-- Cosmetics -->
    <div id="cosmetics-panel">
      <button id="cosmetics-toggle" onclick="toggleCosmetics()">
        <span>✦</span> outfit
      </button>
      <div id="cosmetics-menu">
        <div class="cosm-label">Hats</div>
        <div class="cosm-grid" id="hat-grid"></div>
        <div class="cosm-label">Pets</div>
        <div class="cosm-grid" id="pet-grid"></div>
      </div>
    </div>

    <!-- Chat -->
    <div id="chat-panel">
      <div id="chat-messages"></div>
      <div class="chat-input-row">
        <input id="chat-input" type="text" placeholder="say something cozy..." maxlength="120" autocomplete="off">
        <button class="send-btn" onclick="sendChat()">↑</button>
      </div>
    </div>

    <!-- Emotes -->
    <div id="emote-bar">
      <button class="emote-btn" onclick="sendEmote('👋')" title="wave">👋</button>
      <button class="emote-btn" onclick="sendEmote('💛')" title="love">💛</button>
      <button class="emote-btn" onclick="sendEmote('✨')" title="sparkle">✨</button>
      <button class="emote-btn" onclick="sendEmote('🌧️')" title="rain">🌧️</button>
      <button class="emote-btn" onclick="sendEmote('😌')" title="cozy">😌</button>
      <button class="emote-btn" onclick="sendEmote('🔥')" title="fire">🔥</button>
      <button class="emote-btn" onclick="sendEmote('🌙')" title="moon">🌙</button>
      <button class="emote-btn" onclick="sendEmote('🎵')" title="music">🎵</button>
    </div>

    <!-- Hint -->
    <div id="hint-bar">
      <span id="hint-text">click anywhere to move • click a spot to sit</span>
    </div>

    <!-- Music -->
    <div id="music-bar">
      <span class="music-vinyl">🎵</span>
      <div>
        <div class="music-title" id="music-title">midnight lo-fi rain</div>
        <div style="font-size:0.6rem;margin-top:2px;color:var(--muted);">synced playback</div>
      </div>
      <div class="music-eq"><span></span><span></span><span></span><span></span></div>
    </div>

  </div>
</div>

<script src="game.js"></script>

<script>
/* Lobby sparkle stars */
(function() {
  const c = document.getElementById('lobby-stars');
  for (let i = 0; i < 90; i++) {
    const s = document.createElement('div');
    s.className = 'star';
    const sz = Math.random() * 2.5 + 0.5;
    s.style.cssText = `
      width:${sz}px; height:${sz}px;
      left:${Math.random()*100}%;
      top:${Math.random()*100}%;
      --dur:${2+Math.random()*4}s;
      --delay:${Math.random()*4}s;
      --op:${0.3+Math.random()*0.7};
    `;
    c.appendChild(s);
  }
})();
</script>

</body>
</html>
